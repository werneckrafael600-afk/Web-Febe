<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card do meu perfil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --bg-body: #f3f4f6;
            --card-bg: #ffffff;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-body);
        }

        .profile-card {
            background-color: var(--card-bg);
            width: 320px;
            padding: 2rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 1.5rem;
            border: 4px solid var(--bg-body);
        }

        .profile-name {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .profile-role {
            font-size: 1rem;
            color: var(--text-sub);
            margin-bottom: 2rem;
        }

        .profile-button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            width: 100%;
        }

        .profile-card:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
        }

        .profile-button:hover {
            background-color: var(--primary-hover);
        }

        .profile-button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <div class="profile-card">
        <img src="minha foto.jpeg" alt="Foto de Perfil" class="profile-img">
        <h2 class="profile-name">Rafael Dos Santos Werneck</h2>
        <p class="profile-role">Estudante Universitario</p>
        <a href="https://github.com/werneckrafael600-afk" target="_blank" class="profile-button"
            style="text-decoration: none; display: inline-block;">Seguir Perfil
        </a>
    </div>

</body>
